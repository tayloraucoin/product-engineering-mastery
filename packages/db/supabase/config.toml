# The Supabase CLI's config for both local modes (D-STK-6), pinned with the
# CLI in packages/db/package.json. Everything not set here is the CLI default.
#
#   Mode A, the default: `yarn db:local` runs `supabase db start` with Auth
#   switched off for that run (SUPABASE_AUTH_ENABLED=false), so the database
#   has no auth.identities and the local auth mirror may write auth.users.
#   Mode B: `yarn db:local:full` runs `supabase start`, the whole stack, with
#   Auth on as below. Auth creates auth.identities and the mirror stays shut.
#
# Drizzle owns the public schema: the CLI applies no migrations and no seeds.

project_id = "pem"

[api]
enabled = true
port = 54321

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]

[auth.email]
enable_confirmations = false

# Not used by the starter; off so Mode B pulls and runs less.
[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
