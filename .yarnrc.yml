nodeLinker: node-modules

# A new release waits a week before any install may take it (.claude/rules/deps.md).
npmMinimalAgeGate: 7d

# The one exception (EN-14): a security fix younger than a week, as one exact
# name@x.y.z, with a ledger line naming the advisory; removed once a week old.
npmPreapprovedPackages: []
